<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Collector 0.2 — Polder</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#64b9d2;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px;z-index:3;pointer-events:none}.pill{background:#ffffffe8;padding:8px 11px;border-radius:16px;font-weight:800;font-size:13px;box-shadow:0 3px 12px #0002}.pill:last-child{margin-left:auto}
#msg{position:fixed;top:58px;left:50%;transform:translateX(-50%);max-width:88%;text-align:center;background:#173c48e8;color:#fff;padding:8px 12px;border-radius:14px;font-size:13px;font-weight:650;z-index:3;pointer-events:none}
.bottom{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:4}button{border:0;border-radius:17px;padding:11px 7px;background:#fff;font:750 13px system-ui;box-shadow:0 4px 14px #0003}.small{font-size:10px;opacity:.62}
</style></head><body><canvas id="g"></canvas>
<div class="hud"><div class="pill">€ <span id="money">0</span></div><div class="pill">🌱 <span id="land">0</span> m²</div><div class="pill">⏳ <span id="sand">0</span>/<span id="cap">80</span></div></div>
<div id="msg">Rijd naar het zanddepot</div>
<div class="bottom"><button id="capBtn">📦 Capaciteit L1<br><span class="small">€120</span></button><button id="speedBtn">⚡ Laden L1<br><span class="small">€90</span></button></div>
<script>
(function(){
var cv=document.getElementById('g'),ctx=cv.getContext('2d'),W,H,D=1,coastY,drag=false,last=null;
var car={x:0,y:0,r:20,sand:0,cap:80,loading:false}, depot={x:0,y:0,r:42};
var dikes=[],polders=[],money=0,land=0,capLv=1,speedLv=1,loadStart=0,loadFrom=0,flash=null;
var $=function(id){return document.getElementById(id)},msg=$('msg');
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);coastY=H*.72;depot.x=W*.16;depot.y=coastY+35;if(!car.x){car.x=W*.32;car.y=coastY-5}}
addEventListener('resize',resize);resize();
function dist(a,b,c,d){var x=a-c,y=b-d;return Math.sqrt(x*x+y*y)}
function nearDepot(){return dist(car.x,car.y,depot.x,depot.y)<depot.r+32}
function ui(){ $('money').textContent=Math.floor(money);$('land').textContent=Math.floor(land);$('sand').textContent=Math.floor(car.sand);$('cap').textContent=car.cap;
$('capBtn').innerHTML='📦 Capaciteit L'+capLv+'<br><span class="small">€'+(120*capLv)+'</span>';$('speedBtn').innerHTML='⚡ Laden L'+speedLv+'<br><span class="small">€'+(90*speedLv)+'</span>';
if(car.loading)msg.textContent='Zand laden… '+Math.floor(car.sand)+'/'+car.cap;else if(car.sand>0)msg.textContent='Teken een dijk en sluit hem weer aan op de kust';else msg.textContent='Rijd naar het zanddepot voor een nieuwe lading'}
function startLoad(){if(car.loading||car.sand>=car.cap)return;car.loading=true;loadStart=performance.now();loadFrom=car.sand}
function updateLoad(){if(!car.loading)return;if(!nearDepot()){car.loading=false;return}var seconds=3.2/Math.pow(1.45,speedLv-1),p=Math.min(1,(performance.now()-loadStart)/1000/seconds);car.sand=loadFrom+(car.cap-loadFrom)*p;if(p>=1){car.sand=car.cap;car.loading=false;if(navigator.vibrate)navigator.vibrate(30)}ui()}
function onCoast(p){return p.y>=coastY-13}
function addDike(a,b){var len=dist(a.x,a.y,b.x,b.y);if(len<4||car.sand<=0)return;var use=Math.min(car.sand,len*.7),ratio=use/(len*.7);var end={x:a.x+(b.x-a.x)*ratio,y:a.y+(b.y-a.y)*ratio};dikes.push({a:{x:a.x,y:a.y},b:end});car.sand-=use;return end}
function traceStart(){if(!last||onCoast(last))return null;for(var i=dikes.length-1;i>=0;i--)if(dist(last.x,last.y,dikes[i].b.x,dikes[i].b.y)<24)return i;return null}
function closePolder(){
if(dikes.length<2)return;var end=dikes[dikes.length-1].b;if(!onCoast(end))return;
var pts=[dikes[dikes.length-1].b],i=dikes.length-1;while(i>=0){pts.unshift(dikes[i].a);if(onCoast(dikes[i].a))break;i--}if(i<0||pts.length<3)return;
var a=pts[0],b=pts[pts.length-1];pts.push({x:b.x,y:coastY},{x:a.x,y:coastY});
var area=0;for(var j=0;j<pts.length;j++){var k=(j+1)%pts.length;area+=pts[j].x*pts[k].y-pts[k].x*pts[j].y}area=Math.abs(area)/2;
if(area<1800)return;var m2=Math.round(area/55),reward=Math.max(25,Math.round(m2*1.25));polders.push({pts:pts,created:performance.now(),m2:m2});land+=m2;money+=reward;flash={text:'+'+m2+' m²  ·  +€'+reward,t:performance.now()};if(navigator.vibrate)navigator.vibrate([35,45,70]);ui()}
function point(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',function(e){var p=point(e);if(dist(p.x,p.y,car.x,car.y)<55){drag=true;last={x:car.x,y:car.y};cv.setPointerCapture&&cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',function(e){if(!drag)return;var p=point(e),nx=Math.max(20,Math.min(W-20,p.x)),ny=Math.max(82,Math.min(H-95,p.y));var prev={x:car.x,y:car.y};car.x=nx;car.y=ny;
if(car.sand>0&&prev.y<coastY+8&&ny<coastY+8){var end=addDike(prev,{x:nx,y:ny});if(end&&end.x!==nx){car.x=end.x;car.y=end.y}}
last={x:car.x,y:car.y};if(nearDepot())startLoad();ui()});
cv.addEventListener('pointerup',function(){if(!drag)return;drag=false;if(nearDepot())startLoad();closePolder();last=null;ui()});cv.addEventListener('pointercancel',function(){drag=false;last=null});
$('capBtn').onclick=function(){var c=120*capLv;if(money>=c){money-=c;capLv++;car.cap+=35;ui()}};
$('speedBtn').onclick=function(){var c=90*speedLv;if(money>=c){money-=c;speedLv++;ui()}};
function path(poly){ctx.beginPath();ctx.moveTo(poly[0].x,poly[0].y);for(var i=1;i<poly.length;i++)ctx.lineTo(poly[i].x,poly[i].y);ctx.closePath()}
function draw(){
updateLoad();ctx.clearRect(0,0,W,H);ctx.fillStyle='#62bad4';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#ffffff20';ctx.lineWidth=1;for(var y=100;y<coastY;y+=34){ctx.beginPath();for(var x=0;x<W;x+=20){ctx.lineTo(x,y+Math.sin((x+y)/35)*2)}ctx.stroke()}
for(var i=0;i<polders.length;i++){var q=polders[i],p=Math.min(1,(performance.now()-q.created)/1800);path(q.pts);ctx.fillStyle=p<.45?'rgba(214,194,126,'+(p*.9)+')':'rgba(126,165,88,'+(.45+p*.45)+')';ctx.fill()}
ctx.fillStyle='#88a85c';ctx.fillRect(0,coastY,W,H-coastY);ctx.fillStyle='#e0c36f';ctx.fillRect(0,coastY-8,W,10);
ctx.strokeStyle='#d5b35d';ctx.lineWidth=13;ctx.lineCap='round';for(i=0;i<dikes.length;i++){ctx.beginPath();ctx.moveTo(dikes[i].a.x,dikes[i].a.y);ctx.lineTo(dikes[i].b.x,dikes[i].b.y);ctx.stroke()}
ctx.fillStyle='#e7c06b';ctx.beginPath();ctx.arc(depot.x,depot.y,depot.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6f5526';ctx.font='800 10px system-ui';ctx.textAlign='center';ctx.fillText('ZAND',depot.x,depot.y+3);
ctx.save();ctx.translate(car.x,car.y);ctx.fillStyle='#e8a329';ctx.fillRect(-23,-15,46,30);ctx.fillStyle='#263238';ctx.fillRect(-14,-20,20,10);ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-15,18,7,0,7);ctx.arc(15,18,7,0,7);ctx.fill();ctx.restore();
if(flash&&performance.now()-flash.t<1800){var z=(performance.now()-flash.t)/1800;ctx.fillStyle='rgba(255,255,255,'+(1-z)+')';ctx.font='900 25px system-ui';ctx.textAlign='center';ctx.fillText(flash.text,W/2,H*.34-z*25)}
requestAnimationFrame(draw)}
ui();draw();
})();
</script></body></html>
